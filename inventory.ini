# One line per gateway. Each gateway gets its own gateway_id (0xFF00..0xFFFE).
#
# The SSH options reuse an existing control connection at /tmp/.botssh when
# there is one, and open it (with the key) when there isn't, e.g. after the
# reboot that turns SPI on.
[gateways]
rfgateyway1 ansible_host=192.168.8.110 gateway_id=0xFF01

[gateways:vars]
ansible_user=botmaker
ansible_ssh_private_key_file=~/.ssh/id_ed25519_botmaker
ansible_ssh_common_args=-o ControlMaster=auto -o ControlPath=/tmp/.botssh -o ControlPersist=4h
