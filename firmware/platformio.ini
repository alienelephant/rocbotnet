; rfidprox firmware. First target: the breadboard (docs/BREADBOARD.md), a Heltec
; WiFi LoRa 32 V3 with an RC522, on Wi-Fi to the rfgateway's roclink-nodes AP.
;
;   pio run -e heltec_v3 -t upload && pio device monitor -e heltec_v3
;
; roclink comes from the roclink-rfc repository next to this one.

[env:heltec_v3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
	roclink=symlink://../../roclink-rfc
	https://github.com/OSSLibraries/Arduino_MFRC522v2.git#2.0.6
	olikraus/U8g2@^2.36.18
build_flags =
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-D ARDUINO_USB_CDC_ON_BOOT=0 ; the V3's USB is a CP2102: Serial is UART0
