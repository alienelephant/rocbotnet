# The bench game: the real boxes only, the Heltec's (LoRa), the XIAO's (Wi-Fi),
# the Pico 2 W's, and the box behind the Pico 2 W fob proxy.
# (tools/scavbox.py's simulated boxes, 0x0201 and up, are no longer in it.)
[game]
id = "bench-hunt"
title = "Bench Hunt"
time_limit_min = 120
session_timeout_min = 10
points = 100
hint_penalty_s = [60, 120, 300]
wrong_penalty_s = 30
# Any fob plays, for now (no backend database of fobs yet): an unknown fob's
# first START enters a team for it, shown as "Fob" and its first three hex
# digits (roclink-scavhunt README, "Any fob plays").
open_teams = true
open_team_name = "Fob {first3}"

[[box]]
id = "tower"
name = "Tower (Heltec LoRa)"
net = 0x42
node = 0x0301
points = 200

[[box]]
id = "workshop"
name = "Workshop (XIAO)"
net = 0x42
node = 0x0302

# The Pico 2 W box behind the XIAO that logs in by itself (roclink-scavbox-picow,
# rfidprox xiao_gamebox_auto). Optional: worth points, not needed to finish.
[[box]]
id = "lab"
name = "Lab (Pico 2 W)"
net = 0x42
node = 0x0303
required = false

# The box behind the Pico 2 W fob proxy (rfidprox pico2w_fobproxy): a team logs
# in by tapping its 125 kHz fob, so enter each team's fob ID as its token
# (roclink scavhunt team ... --token <10 hex digits>). Optional, like the Lab.
[[box]]
id = "gate"
name = "Gate (Pico 2 W fob)"
net = 0x42
node = 0x0304
required = false

[service]
name = "scavhunt"
host = "192.168.8.237"
port = 1883
username = "scavhunt"
password_file = "@ROCLINK_DIR@/etc/scavhunt-mqtt-password"
db = "@ROCLINK_DIR@/data/game.db"
verdict_ttl_s = 60
allow_insecure = false

[api]
host = "0.0.0.0"
port = 8090
hub_api = "http://127.0.0.1:8080"   # box data on the scoreboard, from the hub
