[defaults]
inventory = inventory.ini
vault_password_file = .vault-pass
roles_path = roles
# mosquitto_hash, shared with the gateway's playbook
filter_plugins = ../../rfgateways/roclink-gateway/filter_plugins
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false

[ssh_connection]
pipelining = true
