- name: Reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: sysctl --system

- name: Load audit rules
  ansible.builtin.command: augenrules --load
