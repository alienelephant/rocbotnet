# --- users: rocadmin administers, with a key; nobody else may sudo
- name: ssh-users group
  ansible.builtin.group:
    name: ssh-users

- name: Admin user (as bootstrap.yml made it)
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: [sudo, ssh-users]
    append: true
    password: "{{ vault_rocadmin_password_hash }}"
    update_password: on_create

- name: Admin key, and only it
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ lookup('file', admin_key) }}"
    exclusive: true

- name: Admin sudo, without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ admin_user }}
    content: "{{ admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Who else is in sudo?
  ansible.builtin.command: getent group sudo
  register: sudo_group
  changed_when: false

- name: Nobody else may sudo (rocuser stays, as a normal user)
  ansible.builtin.command: gpasswd -d {{ item }} sudo
  loop: "{{ (sudo_group.stdout.split(':')[3] | default('')).split(',') | select | reject('equalto', admin_user) | list }}"

- name: The other SSH users are in ssh-users
  ansible.builtin.user:
    name: "{{ item }}"
    groups: [ssh-users]
    append: true
  loop: "{{ ssh_users | difference([admin_user]) }}"

# --- sshd: keys only, ssh-users only, no root
- name: sshd settings
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/00-roclink.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: The whole sshd config is valid
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

# --- firewall: inbound from the LAN, to the services, only
- name: Am I on the LAN? (or the firewall would shut me out)
  ansible.builtin.shell: >-
    python3 -c 'import ipaddress, sys; sys.exit(ipaddress.ip_address(sys.argv[1]) not in ipaddress.ip_network(sys.argv[2]))'
    "${SSH_CLIENT%% *}" "{{ hub_lan }}"
  become: false
  changed_when: false

- name: nftables
  ansible.builtin.apt:
    name: nftables

- name: Firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Firewall on at boot
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true

# --- fail2ban: bans SSH guessers
- name: fail2ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]

- name: fail2ban jails
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/roclink.local
    content: |
      # Managed by Ansible (infra/roclink-hubhost)
      [DEFAULT]
      backend = systemd
      banaction = nftables-multiport
      banaction_allports = nftables-allports
      bantime = 1h
      bantime.increment = true
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
    mode: "0644"
  notify: Restart fail2ban

- name: fail2ban running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# --- kernel
- name: sysctl
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/90-roclink.conf
    mode: "0644"
  notify: Apply sysctl

- name: Unused network protocols and filesystems never load
  ansible.builtin.copy:
    dest: /etc/modprobe.d/roclink-blacklist.conf
    content: |
      # Managed by Ansible (infra/roclink-hubhost)
      {% for m in ['dccp', 'sctp', 'rds', 'tipc', 'cramfs', 'freevxfs', 'hfs', 'hfsplus', 'jffs2'] %}
      install {{ m }} /bin/false
      {% endfor %}
    mode: "0644"

- name: No core dumps
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-roclink-core.conf
    content: "* hard core 0\n"
    mode: "0644"

# --- audit: who changed users, sudo, sshd or the firewall
- name: auditd and AppArmor
  ansible.builtin.apt:
    name: [auditd, apparmor, apparmor-utils]

- name: Audit rules
  ansible.builtin.copy:
    src: roclink.rules
    dest: /etc/audit/rules.d/roclink.rules
    mode: "0640"
  notify: Load audit rules

- name: auditd running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

# --- less to attack: packages and services a hub has no use for
- name: Installed packages
  ansible.builtin.package_facts:

- name: Remove what a hub doesn't need
  ansible.builtin.apt:
    name: "{{ unwanted_packages | select('in', ansible_facts.packages) | list }}"
    state: absent
    purge: true
  when: unwanted_packages | select('in', ansible_facts.packages) | list | length > 0
