# The hub: a Debian 13 box on the LAN.
#
# site.yml logs in as rocadmin with its key. The SSH options reuse a control
# connection at /tmp/.rochub when there is one, and open it when there isn't.
# bootstrap.yml, run once on a fresh install, logs in as rocuser instead
# (docs/runbooks/install.md).
[hub]
roclink-hub ansible_host=192.168.8.134

[hub:vars]
ansible_user=rocadmin
ansible_ssh_private_key_file=~/.ssh/id_ed25519_rocadmin
ansible_ssh_common_args=-o ControlMaster=auto -o ControlPath=/tmp/.rochub -o ControlPersist=4h
