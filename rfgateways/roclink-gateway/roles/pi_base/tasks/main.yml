# The concentrator talks SPI (/dev/spidev0.0); the HAL also reads the board's
# temperature sensor over I2C (/dev/i2c-1). Both need a reboot to appear.
- name: Turn on SPI and I2C
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^#?dtparam={{ item }}="
    line: "dtparam={{ item }}=on"
    insertbefore: "^\\[cm4\\]"
  loop: [spi, i2c_arm]
  register: dtparams

- name: Load i2c-dev at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/i2c-dev.conf
    content: "i2c-dev\n"
    mode: "0644"

- name: Reboot for SPI and I2C
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: dtparams is changed

- name: Check SPI and I2C devices
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/dev/spidev0.0, /dev/i2c-1]
  register: devs
  failed_when: not devs.stat.exists

- name: Packages
  ansible.builtin.apt:
    name: [build-essential, git, libmosquitto-dev, libcjson-dev, libssl-dev, i2c-tools]
    update_cache: true
    cache_valid_time: 86400

- name: timesyncd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"
  when: ntp_server | default('') | length > 0

- name: Time from the hub
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/roclink.conf
    content: |
      # Managed by Ansible (rfgateways/roclink-gateway)
      [Time]
      NTP={{ ntp_server }}
      FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org
    mode: "0644"
  when: ntp_server | default('') | length > 0
  register: timesyncd

- name: timesyncd picks it up
  ansible.builtin.service:
    name: systemd-timesyncd
    state: restarted
  when: timesyncd is changed
