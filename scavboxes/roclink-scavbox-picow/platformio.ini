; roclink-scavbox-picow: a demo puzzle box on a Raspberry Pi Pico 2 W (RP2350),
; talking boxlink to an rfidprox on UART0 (GP0/GP1, its default Serial1 pins).
;
;   pio run -t upload && pio device monitor
;
; The Arduino core is Earle Philhower's arduino-pico, through Max Gerhardt's
; PlatformIO platform. BoxLink comes from the rfidprox repository, at
; ../../rfidproxies/rfidprox in the rocbotnet layout.

[env:scavbox]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
	boxlink=symlink://../../rfidproxies/rfidprox/boxlink
build_flags =
	-Wall
	-Wextra
