; roclink-scavbox-wifi: a demo puzzle box, talking boxlink to an rfidprox over
; a UART. Two builds:
;   scavbox  an ESP32 dev board (GW-394, ESP32-WROOM-32): BOOT is the puzzle,
;            hold 1.5 s to win; the proxy on UART2 (GPIO 16/17)
;   xiao     a Seeed XIAO ESP32-S3: a push button on D0 is the puzzle, hold 5 s
;            to win; the proxy on D6 (TX) / D7 (RX), e.g. the Pico 2 W fob proxy
;
;   pio run -e scavbox -t upload && pio device monitor -e scavbox
;   pio run -e xiao -t upload && pio device monitor -e xiao
;
; BoxLink comes from the rfidprox repository, at ../../rfidproxies/rfidprox in
; the rocbotnet layout.

[platformio]
default_envs = scavbox  ; a bare `pio run` builds the ESP32 dev board, as before

[env:scavbox]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	boxlink=symlink://../../rfidproxies/rfidprox/boxlink
build_flags =
	-Wall
	-Wextra

[env:xiao]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	boxlink=symlink://../../rfidproxies/rfidprox/boxlink
build_flags =
	-Wall
	-Wextra
	-D BOX_TYPE='"scavbox-xiao"'
	-D PIN_BUTTON=1    ; D0: a push button to GND (INPUT_PULLUP)
	-D PIN_BOX_TX=43   ; D6: box TX -> proxy RX (Pico 2 W: GP1)
	-D PIN_BOX_RX=44   ; D7: box RX <- proxy TX (Pico 2 W: GP0)
	-D PIN_LED=21      ; the orange user LED, on while a team is logged in
	-D LED_ON=LOW      ; it's wired to 3V3: on when the pin is low
	-D WIN_HOLD_MS=5000
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1 ; Serial is the native USB port
