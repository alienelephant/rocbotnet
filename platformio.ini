; roclink-scavbox-wifi: a demo puzzle box on an ESP32 dev board (GW-394,
; ESP32-WROOM-32), talking boxlink to an rfidprox on its UART2.
;
;   pio run -t upload && pio device monitor
;
; BoxLink comes from the rfidprox repository next to this one.

[env:scavbox]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	boxlink=symlink://../rfidprox/boxlink
build_flags =
	-Wall
	-Wextra
