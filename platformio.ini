; roclink-scavbox-lora: a demo puzzle box on an ESP32-S3 DevKit (ESP32-S3-
; DevKitC-1, two USB-C ports), talking boxlink to a Heltec rfidprox on GPIO 17/18.
;
;   pio run -t upload && pio device monitor      (the port marked UART)
;
; BoxLink comes from the rfidprox repository next to this one.

[env:scavbox]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	boxlink=symlink://../rfidprox/boxlink
build_flags =
	-Wall
	-Wextra
	-Wno-missing-field-initializers ; the S3 framework headers trip it
