; PlatformIO project for roclink: unit tests on the PC and on boards, plus the
; Arduino example sketches in examples/arduino/.
;
; The library itself is src/ (also an Arduino library via library.properties).
; Each sketch env adds one sketch to the build with build_src_filter.
;
;   pio test -e native                          library tests on this PC (native_jumbo: with ROCLINK_JUMBO)
;   pio test -e test_wroom                      the same tests on a board (also test_s3, test_heltec_v2,
;                                               and test_wroom_core2 on Arduino-ESP32 2.x)
;   pio run -e espnow_sender -t upload          ESP-NOW sender   (ESP32 WROOM)
;   pio run -e espnow_receiver -t upload        ESP-NOW receiver (ESP32-S3)
;   pio run -e lora_sender -t upload            LoRa sender      (Heltec WiFi LoRa 32 V2, 915 MHz)
;   pio run -e lora_receiver -t upload          LoRa receiver    (a second Heltec V2)
;   pio run -e wifi_udp_sender -t upload        Wi-Fi UDP sender   (ESP32 WROOM; set SSID/password first)
;   pio run -e wifi_udp_receiver -t upload      Wi-Fi UDP receiver (ESP32-S3)
;   pio run -e lora_secure_sender -t upload     secured LoRa node    (Heltec V2)
;   pio run -e lora_secure_receiver -t upload   secured LoRa gateway (Heltec V2)
;   pio device monitor -e <env>
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
src_dir = src
test_dir = pio_test

; ── shared ───────────────────────────────────────────────────────────────────

[env]
build_flags =
	-I src
	-Wall
	-Wextra
	-Werror=return-type
	-Werror=sign-compare
	-Werror=format
	-Werror=array-bounds
	-Wno-missing-field-initializers ; ESP-IDF's own headers trip this under -Wextra

; Board settings shared by every ESP32 env (tests and sketches).
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
test_speed = 115200

; ── unit tests ───────────────────────────────────────────────────────────────
; Each suite in pio_test/ wraps one of the host test programs in test/.

[env:native]
; AES from OpenSSL on the PC (src/roclink_crypto.h); boards use their own provider
platform = native
test_framework = unity
test_build_src = yes
build_flags =
	${env.build_flags}
	-std=gnu++17
	-D ROCLINK_CRYPTO_OPENSSL
	-lcrypto

[env:native_jumbo]
; the same tests with jumbo frames enabled (1470-byte limit)
platform = native
test_framework = unity
test_build_src = yes
build_flags =
	${env.build_flags}
	-std=gnu++17
	-D ROCLINK_JUMBO
	-D ROCLINK_CRYPTO_OPENSSL
	-lcrypto

[env:test_wroom]
extends = esp32
board = esp32dev
test_framework = unity
test_build_src = yes

[env:test_wroom_core2]
; the same tests on Arduino-ESP32 2.x (ESP-IDF 4.4, mbedTLS 2.28)
platform = espressif32@6.13.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
test_speed = 115200
test_framework = unity
test_build_src = yes

[env:test_s3]
extends = esp32
board = esp32-s3-devkitc-1
test_framework = unity
test_build_src = yes

[env:test_heltec_v2]
extends = esp32
board = heltec_wifi_lora_32_V2
test_framework = unity
test_build_src = yes

; ── example sketches ─────────────────────────────────────────────────────────
; examples/arduino/pio_sketch.cpp includes the sketch named by ROCLINK_SKETCH.

[sketch]
build_src_filter = +<*> +<../examples/arduino/pio_sketch.cpp>
; the sketches are outside src/, so their framework libraries are listed explicitly
espnow_libs = ESP_NOW, WiFi
wifi_libs = WiFi

[env:espnow_sender]
extends = esp32
board = esp32dev
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"espnow_sender/espnow_sender.ino\"
lib_deps = ${sketch.espnow_libs}

[env:espnow_receiver]
extends = esp32
board = esp32-s3-devkitc-1
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"espnow_receiver/espnow_receiver.ino\"
lib_deps = ${sketch.espnow_libs}

[env:lora_sender]
extends = esp32
board = heltec_wifi_lora_32_V2
lib_deps = jgromes/RadioLib@^7.8.1
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"lora_sender/lora_sender.ino\"

[env:lora_receiver]
extends = esp32
board = heltec_wifi_lora_32_V2
lib_deps = jgromes/RadioLib@^7.8.1
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"lora_receiver/lora_receiver.ino\"

[env:wifi_udp_sender]
extends = esp32
board = esp32dev
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"wifi_udp_sender/wifi_udp_sender.ino\"
lib_deps = ${sketch.wifi_libs}

[env:wifi_udp_receiver]
extends = esp32
board = esp32-s3-devkitc-1
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"wifi_udp_receiver/wifi_udp_receiver.ino\"
lib_deps = ${sketch.wifi_libs}

[env:lora_secure_sender]
extends = esp32
board = heltec_wifi_lora_32_V2
lib_deps = jgromes/RadioLib@^7.8.1, Preferences
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"lora_secure_sender/lora_secure_sender.ino\"

[env:lora_secure_receiver]
extends = esp32
board = heltec_wifi_lora_32_V2
lib_deps = jgromes/RadioLib@^7.8.1, Preferences
build_src_filter = ${sketch.build_src_filter}
build_flags = ${env.build_flags} -D ROCLINK_SKETCH=\"lora_secure_receiver/lora_secure_receiver.ino\"
