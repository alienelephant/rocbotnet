; rfidprox firmware. First target: the breadboard (docs/BREADBOARD.md), a Heltec
; WiFi LoRa 32 V3 or V4 with an RC522, on Wi-Fi to the rfgateway's
; roclink-nodes AP.
;
;   pio run -e heltec_v4 -t upload && pio device monitor -e heltec_v4
;   pio run -e heltec_v3 -t upload && pio device monitor -e heltec_v3
;
; roclink comes from the roclink-rfc repository, at ../../../protocol/roclink-rfc
; in the rocbotnet layout.

[rfidprox]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
lib_deps =
	roclink=symlink://../../../protocol/roclink-rfc
	boxlink=symlink://../boxlink
	https://github.com/OSSLibraries/Arduino_MFRC522v2.git#2.0.6
	olikraus/U8g2@^2.36.18
build_flags =
	-Wall
	-Wextra
	-Wno-missing-field-initializers

[env:heltec_v3]
platform = ${rfidprox.platform}
framework = arduino
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps = ${rfidprox.lib_deps}
build_src_filter = +<*> -<gamebox.cpp>
build_flags =
	${rfidprox.build_flags}
	-D RFIDPROX_BOARD_V3
	-D ARDUINO_USB_CDC_ON_BOOT=0 ; the V3's USB is a CP2102 on UART0 (GPIO 43/44)

; The V4 is pin-compatible with the V3 (same headers), but has native USB
; (GPIO 19/20, no CP2102), 16 MB flash and 2 MB PSRAM (ESP32-S3R2). This
; platform release has no V4 board definition, so it's the V3's with those changes.
[env:heltec_v4]
extends = env:heltec_v3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
	${rfidprox.build_flags}
	-D RFIDPROX_BOARD_V4
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1 ; Serial is the native USB port

; The game-box builds (src/gamebox.cpp, docs/BOXLINK.md section 9): the proxy
; as a scavhunt box's link to the game, for the demo. No card reader: PRG logs
; in with a dummy fob. Same node address and key. tools/boxsim.py plays the box
; over the USB port.
;
;   pio run -e heltec_v3_gamebox -t upload && pio device monitor -e heltec_v3_gamebox
[env:heltec_v3_gamebox]
extends = env:heltec_v3
build_src_filter = +<*> -<main.cpp>
monitor_echo = yes

[env:heltec_v4_gamebox]
extends = env:heltec_v4
build_src_filter = +<*> -<main.cpp>
monitor_echo = yes

; The game-box build on a Seeed XIAO ESP32-S3, for the Wi-Fi example
; (roclink-scavbox-wifi): node 0x0302, a push button on D0 to log in, the user
; LED for the state, the box on D6 (TX) and D7 (RX). Attach the Wi-Fi antenna.
;
;   pio run -e xiao_gamebox -t upload && pio device monitor -e xiao_gamebox
[env:xiao_gamebox]
platform = ${rfidprox.platform}
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	roclink=symlink://../../../protocol/roclink-rfc
	boxlink=symlink://../boxlink
build_src_filter = +<*> -<main.cpp>
build_flags =
	${rfidprox.build_flags}
	-D RFIDPROX_BOARD_XIAO
	-D ROCLINK_NODE=0x0302
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1 ; Serial is the native USB port

; The Heltec game-box build over LoRa, for the LoRa example (roclink-scavbox-lora):
; the same proxy at node 0x0301, its SX1262 to the rfgateway's concentrator at
; 915.0 MHz, SF9 (src/transport_lora.cpp). PRG logs in; the box is on J3-9/J3-10.
;
;   pio run -e heltec_v3_gamebox_lora -t upload && pio device monitor -e heltec_v3_gamebox_lora
[env:heltec_v3_gamebox_lora]
extends = env:heltec_v3_gamebox
lib_deps =
	${rfidprox.lib_deps}
	jgromes/RadioLib@7.8.1
build_flags =
	${env:heltec_v3.build_flags}
	-D RFIDPROX_LORA=1
